[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualphoto"
version = "0.1.0"
description = "Processing tools for dual photography scan sessions"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
viewer = ["matplotlib", "opencv-python"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["dualphoto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
